# Dedicated LOCAL-DEVELOPMENT broker profile.
# Does not edit the default Mosquitto service configuration.
# Listener is bound to loopback only: no LAN or Internet exposure.

listener 8883 127.0.0.1
allow_anonymous false

password_file C:/vending-mqtt/config/password.txt
acl_file C:/vending-mqtt/config/acl.txt

certfile C:/vending-mqtt/certs/server.crt
keyfile C:/vending-mqtt/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location C:/vending-mqtt/data/

log_dest file C:/vending-mqtt/logs/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# Basic resource limits for development. Revisit if payloads need to be larger.
max_packet_size 65536
message_size_limit 32768
